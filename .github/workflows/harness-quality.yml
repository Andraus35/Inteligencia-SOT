name: Harness quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned development tools
        run: python -m pip install uv==0.12.19
      - name: Install locked dependencies
        run: UV_CACHE_DIR=.cache/uv uv sync --locked --group dev
      - name: Prepare pinned translation runtime
        run: docker pull python@sha256:05cda9777409a9c3ffddd94a4c476b79f0769a0b4857f0c7ed9226b6800b0d6f
      - name: Governance, lint, typecheck and format
        run: make governance lint typecheck format-check
      - name: Tests including Docker sandbox
        run: make test-docker
      - name: Paladini maturity regression gate L4
        run: make score-check
      - name: Deterministic Harness Eval A
        run: make eval-a RUN_ID=ci-${{ github.run_id }}-${{ github.run_attempt }}
